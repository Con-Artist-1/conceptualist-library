    <!-- DNS Prefetch & Critical Preload (Hugging Face preconnect injected lazily on paper hover) -->
    <link rel="dns-prefetch" href="https://huggingface.co" />
    <link rel="dns-prefetch" href="https://us.aws.cdn.hf.co" />
    <link rel="preload" href="/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="cs-boot" data-bt="__CS_BUILD_TIME__" data-ver="__CS_APP_VERSION__" data-shard="__CS_ROUTE_SHARD__" data-full="__CS_ROUTE_NEEDS_FULL__" />
    <script>
      (function() {
        document.documentElement.classList.add('js-enabled');
        function isValidTheme(v) {
          return v === 'light' || v === 'dark' || v === 'oled';
        }
        try {
          var match = document.cookie.match(/(?:^|; )cs_theme=([^;]*)/);
          var cookieTheme = match ? decodeURIComponent(match[1]) : null;
          var localTheme = localStorage.getItem('cs_theme');
          var t = isValidTheme(cookieTheme)
            ? cookieTheme
            : (isValidTheme(localTheme)
                ? localTheme
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
          document.documentElement.setAttribute('data-theme', t);
          var metaTc = document.getElementById('meta-theme-color');
          if (metaTc) {
            metaTc.setAttribute('content', t === 'oled' ? '#000000' : (t === 'dark' ? '#121417' : '#6F1D2B'));
          }
        } catch (e) {
          var fallback = 'light';
          try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              fallback = 'dark';
            }
          } catch (err) {}
          document.documentElement.setAttribute('data-theme', fallback);
        }

        // Parallel early fetch: download /meta.json + active route shard (or /index.json on /papers)
        // simultaneously with CSS & JS bundles to eliminate the startup network waterfall.
        try {
          var bootEl = document.querySelector('meta[name="cs-boot"]');
          var bt = bootEl ? (bootEl.getAttribute('data-bt') || '') : '';
          if (bt && bt.indexOf('__CS_') !== 0 && typeof fetch === 'function') {
            var q = encodeURIComponent(bt);
            var shard = bootEl ? (bootEl.getAttribute('data-shard') || '') : '';
            if (shard.indexOf('__CS_') === 0) shard = '';
            var needsFull = (bootEl ? bootEl.getAttribute('data-full') : '') === '1';
            if (!shard && !needsFull) {
              var p = (location.pathname || '/').replace(/\/+$/, '') || '/';
              var segs = p.split('/').filter(Boolean);
              if (p === '/textbooks' || p === '/textbooks/ial' || p === '/textbooks/igcse') shard = '/shards/textbooks.json';
              else if (p === '/audio') shard = '/shards/audio.json';
              else if (p === '/data-files') shard = '/shards/data-files.json';
              else if (segs[0] === 'textbooks' && segs.length === 3) shard = '/shards/' + segs[1].toLowerCase() + '-' + segs[2].toLowerCase() + '.json';
              else if (segs[0] === 'ial' && segs[1] && segs[1].toLowerCase() === 'mathematics' && segs.length >= 3) {
                var uSlug = segs[2].toLowerCase();
                if (/mechanics|wme0|667[7-9]/.test(uSlug)) shard = '/shards/ial-mathematics-mechanics.json';
                else if (/statistics|wst0|6683|6684|6691/.test(uSlug)) shard = '/shards/ial-mathematics-statistics.json';
                else if (/further|decision|wfm0|wdm|666[7-9]|6689/.test(uSlug)) shard = '/shards/ial-mathematics-further.json';
                else shard = '/shards/ial-mathematics-pure.json';
              }
              else if ((segs[0] === 'ial' || segs[0] === 'igcse') && segs.length >= 2) shard = '/shards/' + segs[0] + '-' + segs[1].toLowerCase() + '.json';
              else if (p === '/papers' || p === '/ial' || p === '/igcse' || (location.search && location.search.indexOf('q=') !== -1)) needsFull = true;
            }
            var ef = {
              buildTime: bt,
              shardPath: shard,
              metaPromise: null,
              shardBufferPromise: null,
              fullBufferPromise: null
            };
            ef.metaPromise = fetch('/meta.json?v=' + q)
              .then(function(r) { return r.ok ? r.json() : null; })
              .catch(function() { return null; });

            if (shard || needsFull) {
              var appVer = bootEl ? (bootEl.getAttribute('data-ver') || '') : '';
              var verTag = (appVer && appVer.indexOf('__CS_') !== 0) ? appVer : 'v7.0';
              var cacheKey = 'https://cs-cache.local/index_' + verTag + '_' + q + '.json';
              var checkCache = (typeof caches !== 'undefined')
                ? caches.open('cs_index_cache')
                    .then(function(c) { return c.match(cacheKey); })
                    .catch(function() { return null; })
                : Promise.resolve(null);

              if (shard) {
                ef.shardBufferPromise = checkCache.then(function(hit) {
                  if (hit) return null;
                  return fetch(shard + '?v=' + q, { priority: 'low' })
                    .then(function(r) {
                      var ct = r.headers.get('content-type') || '';
                      return (r.ok && ct.indexOf('application/json') !== -1) ? r.arrayBuffer() : null;
                    })
                    .catch(function() { return null; });
                });
              } else if (needsFull) {
                ef.fullBufferPromise = checkCache.then(function(hit) {
                  if (hit) return null;
                  return fetch('/index.json?v=' + q, { priority: 'low' })
                    .then(function(r) { return r.ok ? r.arrayBuffer() : null; })
                    .catch(function() { return null; });
                });
              }
            }
            window.__CS_EARLY_FETCH__ = ef;
          }
        } catch (err) {}
      })();
      window.addEventListener('vite:preloadError', function () {
        try {
          if (sessionStorage.getItem('cs_chunk_reload')) return;
          sessionStorage.setItem('cs_chunk_reload', '1');
        } catch (e) {}
        window.location.reload();
      });
    </script>

    <!-- Critical Anti-FOUC Baseline Theme, Surface & Instant Boot Shell Styles -->
    <style id="critical-anti-fouc">
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --bg-page: #121417;
          --bg-surface: #1B1E23;
          --text-primary: #F0F2F5;
          --text-muted: #9AA4B2;
          --border-medium: #282C34;
          --mcmaster-maroon: #8C1D2F;
          --mcmaster-gold: #D4AF37;
          --boot-hdr-bg: #17191E;
          --boot-hdr-border: #8C1D2F;
          background-color: #121417;
          color: #F0F2F5;
        }
      }
      :root, [data-theme='light'] {
        --bg-page: #F4F3EF;
        --bg-surface: #FFFFFF;
        --text-primary: #1A1D20;
        --text-muted: #525860;
        --border-medium: #C8C4BC;
        --mcmaster-maroon: #6F1D2B;
        --mcmaster-gold: #C9A45C;
        --boot-hdr-bg: #6F1D2B;
        --boot-hdr-border: #C9A45C;
        background-color: #F4F3EF;
        color: #1A1D20;
      }
      [data-theme='dark'] {
        --bg-page: #121417;
        --bg-surface: #1B1E23;
        --text-primary: #F0F2F5;
        --text-muted: #9AA4B2;
        --border-medium: #282C34;
        --mcmaster-maroon: #8C1D2F;
        --mcmaster-gold: #D4AF37;
        --boot-hdr-bg: #17191E;
        --boot-hdr-border: #8C1D2F;
        background-color: #121417;
        color: #F0F2F5;
      }
      [data-theme='oled'] {
        --bg-page: #000000;
        --bg-surface: #000000;
        --text-primary: #FFFFFF;
        --text-muted: #9CA3AF;
        --border-medium: #262626;
        --mcmaster-maroon: #8C1D2F;
        --mcmaster-gold: #FFD33D;
        --boot-hdr-bg: #000000;
        --boot-hdr-border: #222222;
        background-color: #000000;
        color: #FFFFFF;
      }
      html {
        background-color: var(--bg-page);
        margin: 0;
        padding: 0;
        max-width: 100vw;
        overflow-x: hidden;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-page);
        color: var(--text-primary);
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        max-width: 100vw;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        background-color: var(--bg-page);
      }
      html.js-enabled .seo-prerender-shell {
        display: none !important;
      }
      html:not(.js-enabled) .app-boot-shell {
        display: none !important;
      }
      .app-boot-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--bg-page);
        color: var(--text-primary);
      }
      .boot-header {
        height: 54px;
        padding: 0 24px;
        background: var(--boot-hdr-bg);
        border-bottom: 2px solid var(--boot-hdr-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #FFFFFF;
        box-sizing: border-box;
      }
      .boot-brand {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .boot-brand span {
        color: var(--mcmaster-gold);
        font-weight: 700;
      }
      .boot-search-bar {
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-medium);
        padding: 10px 24px;
      }
      .boot-search-pill {
        max-width: 1280px;
        margin: 0 auto;
        height: 38px;
        border: 1px solid var(--border-medium);
        border-radius: 3px;
        background: var(--bg-page);
      }
      .boot-main {
        max-width: 1280px;
        width: 100%;
        margin: 0 auto;
        padding: 18px 24px;
        box-sizing: border-box;
      }
      .boot-hero {
        background: var(--bg-surface);
        border: 1px solid var(--border-medium);
        border-top: 3px solid var(--mcmaster-maroon);
        border-radius: 3px;
        padding: 18px 22px;
      }
      .boot-title {
        font-size: 21px;
        font-weight: 800;
        color: var(--mcmaster-maroon);
        margin: 0 0 6px 0;
        line-height: 1.25;
      }
      [data-theme='dark'] .boot-title,
      [data-theme='oled'] .boot-title {
        color: var(--text-primary);
      }
      .boot-subtitle {
        font-size: 14px;
        color: var(--text-muted);
        margin: 0;
        line-height: 1.45;
      }
      @media (max-height: 760px) and (min-width: 769px) {
        .boot-header { height: 48px; padding: 0 20px; }
        .boot-search-bar { padding: 8px 20px; }
        .boot-main { padding: 14px 20px; }
      }
      @media (max-width: 768px) {
        .boot-header { height: 50px; padding: 0 14px; }
        .boot-search-bar { padding: 8px 14px; }
        .boot-main { padding: 12px 14px; }
        .boot-title { font-size: 18px; }
      }
    </style>
  </head>
