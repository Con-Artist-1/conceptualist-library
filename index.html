    <!-- Preconnect & Critical Preloads -->
    <link rel="preconnect" href="https://huggingface.co" crossorigin />
    <link rel="preconnect" href="https://us.aws.cdn.hf.co" crossorigin />
    <link rel="preload" href="/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/roboto-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function() {
        document.documentElement.classList.add('js-enabled');
        function isValidTheme(v) {
          return v === 'light' || v === 'dark' || v === 'oled';
        }
        try {
          var match = document.cookie.match(/(?:^|; )cs_theme=([^;]*)/);
          var cookieTheme = match ? decodeURIComponent(match[1]) : null;
          var localTheme = localStorage.getItem('cs_theme');
          var t = isValidTheme(cookieTheme)
            ? cookieTheme
            : (isValidTheme(localTheme)
                ? localTheme
                : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
          // Theme support: 'light' (Academic Light), 'dark' (Academic Dark), 'oled' (Pure OLED)
          document.documentElement.setAttribute('data-theme', t);
          var metaTc = document.getElementById('meta-theme-color');
          if (metaTc) {
            metaTc.setAttribute('content', t === 'oled' ? '#000000' : (t === 'dark' ? '#121417' : '#6F1D2B'));
          }
        } catch (e) {
          var fallback = 'light';
          try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              fallback = 'dark';
            }
          } catch (err) {}
          document.documentElement.setAttribute('data-theme', fallback);
        }
      })();
      window.addEventListener('vite:preloadError', function () {
        try {
          if (sessionStorage.getItem('cs_chunk_reload')) return;
          sessionStorage.setItem('cs_chunk_reload', '1');
        } catch (e) {}
        window.location.reload();
      });
    </script>

    <!-- Critical Anti-FOUC Baseline Theme & Surface Styles -->
    <style id="critical-anti-fouc">
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          --bg-page: #121417;
          --bg-surface: #1B1E23;
          --text-primary: #F0F2F5;
          --mcmaster-maroon: #8C1D2F;
          --mcmaster-gold: #D4AF37;
          background-color: #121417;
          color: #F0F2F5;
        }
      }
      :root, [data-theme='light'] {
        --bg-page: #F4F3EF;
        --bg-surface: #FFFFFF;
        --text-primary: #1A1D20;
        --mcmaster-maroon: #6F1D2B;
        --mcmaster-gold: #C9A45C;
        background-color: #F4F3EF;
        color: #1A1D20;
      }
      [data-theme='dark'] {
        --bg-page: #121417;
        --bg-surface: #1B1E23;
        --text-primary: #F0F2F5;
        --mcmaster-maroon: #8C1D2F;
        --mcmaster-gold: #D4AF37;
        background-color: #121417;
        color: #F0F2F5;
      }
      [data-theme='oled'] {
        --bg-page: #000000;
        --bg-surface: #000000;
        --text-primary: #FFFFFF;
        --mcmaster-maroon: #8C1D2F;
        --mcmaster-gold: #FFD33D;
        background-color: #000000;
        color: #FFFFFF;
      }
      html {
        background-color: var(--bg-page);
        margin: 0;
        padding: 0;
        max-width: 100vw;
        overflow-x: hidden;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-page);
        color: var(--text-primary);
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        max-width: 100vw;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        background-color: var(--bg-page);
      }
      html.js-enabled .seo-prerender-shell {
        display: none !important;
      }
    </style>
