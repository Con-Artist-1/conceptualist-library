<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Conceptualist Systems: Browse thousands of Edexcel past papers, mark schemes, examiner reports, and textbooks. Organised by subject, unit, and year." />
    <meta name="keywords" content="Conceptualist, Conceptualist Systems, Edexcel, IAL, IGCSE, past papers, mark scheme, question paper, examiner report, A-Level" />
    <title>Conceptualist Systems | Library Repository</title>
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

    <!-- Preload Critical Local Self-Hosted Fonts (Zero Latency & Zero FOUT) -->
    <link rel="preload" href="/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function() {
        try {
          var match = document.cookie.match(/(?:^|; )cs_theme=([^;]*)/);
          var cookieTheme = match ? decodeURIComponent(match[1]) : null;
          var localTheme = localStorage.getItem('cs_theme');
          var t = cookieTheme || localTheme;
          // Default to 'light' mode unless explicitly saved as 'dark'
          if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
      window.addEventListener('vite:preloadError', function () {
        try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
        window.location.href = '/?reset=' + Date.now();
      });
    </script>

    <!-- Critical Anti-FOUC Baseline Theme & Surface Styles -->
    <style id="critical-anti-fouc">
      :root, [data-theme='light'] {
        --bg-page: #F2F1ED;
        --bg-surface: #FFFFFF;
        --text-primary: #1A1D20;
        --mcmaster-maroon: #6F1D2B;
        --mcmaster-gold: #C9A45C;
        background-color: #F2F1ED;
        color: #1A1D20;
      }
      [data-theme='dark'] {
        --bg-page: #000000;
        --bg-surface: #000000;
        --text-primary: #FFFFFF;
        --mcmaster-maroon: #8C1D2F;
        --mcmaster-gold: #FFD33D;
        background-color: #000000;
        color: #FFFFFF;
      }
      html {
        background-color: var(--bg-page);
        margin: 0;
        padding: 0;
        max-width: 100vw;
        overflow-x: hidden;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-page);
        color: var(--text-primary);
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        max-width: 100vw;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        background-color: var(--bg-page);
      }
      .seo-prerender-shell {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
