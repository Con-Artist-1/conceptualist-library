    <!-- Preload Critical Local Self-Hosted Fonts (Zero Latency & Zero FOUT) -->
    <link rel="preload" href="/fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function() {
        try {
          var match = document.cookie.match(/(?:^|; )cs_theme=([^;]*)/);
          var cookieTheme = match ? decodeURIComponent(match[1]) : null;
          var localTheme = localStorage.getItem('cs_theme');
          var t = cookieTheme || localTheme;
          // Theme support: 'light' (Zerui Chen Rust/White), 'dark' (Zerui Chen Terminal), 'oled' (Pure Black)
          if (t === 'oled') {
            document.documentElement.setAttribute('data-theme', 'oled');
            var metaTc = document.getElementById('meta-theme-color');
            if (metaTc) metaTc.setAttribute('content', '#000000');
          } else if (t === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            var metaTc = document.getElementById('meta-theme-color');
            if (metaTc) metaTc.setAttribute('content', '#1f211c');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            var metaTc = document.getElementById('meta-theme-color');
            if (metaTc) metaTc.setAttribute('content', '#ddd5c5');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
      window.addEventListener('vite:preloadError', function () {
        try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
        window.location.href = '/?reset=' + Date.now();
      });
    </script>

    <!-- Critical Anti-FOUC Baseline Theme & Surface Styles -->
    <style id="critical-anti-fouc">
      :root, [data-theme='light'] {
        --bg-page: #ddd5c5;
        --bg-surface: #e8e2d4;
        --text-primary: #413c33;
        --mcmaster-maroon: #a4552f;
        --mcmaster-gold: #b98b3e;
        background-color: #ddd5c5;
        color: #413c33;
      }
      [data-theme='dark'] {
        --bg-page: #1f211c;
        --bg-surface: #272a24;
        --text-primary: #cfc9b2;
        --mcmaster-maroon: #b98b3e;
        --mcmaster-gold: #b98b3e;
        background-color: #1f211c;
        color: #cfc9b2;
      }
      [data-theme='oled'] {
        --bg-page: #000000;
        --bg-surface: #000000;
        --text-primary: #FFFFFF;
        --mcmaster-maroon: #8C1D2F;
        --mcmaster-gold: #FFD33D;
        background-color: #000000;
        color: #FFFFFF;
      }
      html {
        background-color: var(--bg-page);
        margin: 0;
        padding: 0;
        max-width: 100vw;
        overflow-x: hidden;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-page);
        color: var(--text-primary);
        font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        max-width: 100vw;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
        background-color: var(--bg-page);
      }
      .seo-prerender-shell {
        display: none !important;
      }
    </style>
  </head>
